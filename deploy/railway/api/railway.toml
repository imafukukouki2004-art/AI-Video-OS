[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "migrations/**",
  "pyproject.toml",
  "alembic.ini",
  "deploy/railway/api/**",
]

[deploy]
preDeployCommand = ["alembic upgrade head"]
startCommand = "/bin/sh -c \"exec uvicorn apps.api.main:app --host 0.0.0.0 --port ${PORT:-8000}\""
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
