name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy apps/api apps/worker

      - name: Test
        run: pytest --cov=apps/api --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  acceptance:
    name: Development Environment Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ai_video_os:change-me-local-only@127.0.0.1:5432/ai_video_os
      REDIS_URL: redis://127.0.0.1:6379/0
      STORAGE_ENDPOINT_URL: http://127.0.0.1:9000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Start infrastructure
        run: |
          docker compose up -d postgres redis minio celery-worker
          docker compose run --rm minio-init

      - name: Run migrations
        run: alembic upgrade head

      - name: Start API
        run: |
          uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 &
          sleep 10

      - name: Run Acceptance Suite
        run: python scripts/acceptance_suite.py

      - name: Diagnostic logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs
